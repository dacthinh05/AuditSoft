<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="45%" stop-color="#0F282F" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>

    <!-- Emerald Primary Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="40%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Cyan/Teal Tech Flow Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="60%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#5EEAD4" />
    </linearGradient>

    <!-- Golden Benchmark Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Soft Light Sheen -->
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base App Icon Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#1E3A4C" stroke-width="2" />
  <rect x="18" y="18" width="476" height="230" rx="106" fill="url(#sheenGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Subtle Financial Grid & IQR Baseline in Background -->
  <g opacity="0.15">
    <line x1="80" y1="380" x2="432" y2="380" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="80" y1="310" x2="432" y2="310" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="80" y1="240" x2="432" y2="240" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="80" y1="170" x2="432" y2="170" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <!-- Core Mark: Dynamic Lettermark "V" with Financial IQR Bars & Arm's Length Arc -->
  <g filter="url(#dropShadow)">
    
    <!-- LEFT WING OF "V": Aerodynamic Precision Pillar -->
    <!-- Represents Institutional Foundation / Vietstock Source Data -->
    <path d="M 124 142 
             C 142 142, 168 156, 178 174 
             L 242 334 
             C 248 348, 246 362, 236 370 
             C 226 378, 212 376, 204 362 
             L 106 172 
             C 98 156, 108 142, 124 142 Z" 
          fill="url(#emeraldGrad)" />

    <!-- Left Wing Inner Highlight Spine -->
    <path d="M 128 152 L 216 348" 
          stroke="rgba(255, 255, 255, 0.45)" 
          stroke-width="3" 
          stroke-linecap="round" />

    <!-- RIGHT WING OF "V": Ascending Interquartile Bars (Q1, Median, Q3) -->
    <!-- 1. Q1 Lower Quartile Pillar -->
    <rect x="264" y="278" width="34" height="96" rx="10" 
          fill="url(#tealGrad)" opacity="0.9" />

    <!-- 2. Median / Central Benchmark Pillar -->
    <rect x="316" y="214" width="34" height="160" rx="10" 
          fill="url(#emeraldGrad)" />

    <!-- 3. Q3 Upper Quartile & Growth Breakout Pillar -->
    <rect x="368" y="146" width="34" height="228" rx="10" 
          fill="url(#emeraldGrad)" />

    <!-- IQR Bridge: Connecting Arm's Length Range Band [Q1 - Q3] -->
    <path d="M 264 340 L 402 340" 
          stroke="rgba(255,255,255,0.22)" 
          stroke-width="2" 
          stroke-dasharray="3 3" />

    <!-- The Transfer Pricing Arm's Length Arc (Cầu nối Giao dịch liên kết) -->
    <!-- Trajectory passing from tested party wing through benchmark data -->
    <path d="M 100 286 
             C 170 366, 260 380, 360 280 
             C 400 240, 428 175, 436 128" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="5" 
          stroke-linecap="round" 
          filter="url(#softGlow)" />

    <!-- Data Pulse Nodes on the Arc -->
    <!-- Node 1: Tested Party Transaction -->
    <circle cx="152" cy="336" r="6" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2.5" />
    <!-- Node 2: Median Settlement Equilibrium -->
    <circle cx="333" cy="298" r="8" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5" />
    <!-- Node 3: Target Arm's Length Apex -->
    <circle cx="436" cy="128" r="5" fill="#FDE68A" stroke="#F59E0B" stroke-width="2" />

    <!-- Precision Star / Audit Compass at Top Right Breakout -->
    <g transform="translate(436, 128)">
      <path d="M 0 -22 L 5 -6 L 21 0 L 5 6 L 0 22 L -5 6 L -21 0 L -5 -6 Z" 
            fill="url(#goldGrad)" />
      <circle cx="0" cy="0" r="3.5" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Bottom Regulatory Tag / Decree 132 Compliance Monogram -->
  <g transform="translate(256, 442)">
    <rect x="-84" y="-14" width="168" height="26" rx="13" 
          fill="rgba(15, 23, 42, 0.65)" 
          stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
    <text x="0" y="3.5" 
          font-family="'Inter', -apple-system, sans-serif" 
          font-size="10.5" 
          font-weight="700" 
          letter-spacing="1.5" 
          fill="#34D399" 
          text-anchor="middle">DECREE 132 • TP</text>
  </g>
</svg>
