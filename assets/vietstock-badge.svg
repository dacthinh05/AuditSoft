<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="badgeRadialBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0F2B32" />
      <stop offset="60%" stop-color="#0B1528" />
      <stop offset="100%" stop-color="#050B14" />
    </radialGradient>

    <!-- Gold Foil Gradients -->
    <linearGradient id="badgeGoldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <linearGradient id="badgeEmeraldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="40%" stop-color="#10B981" />
      <stop offset="80%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>

    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Hexagonal / Shield Silhouette -->
  <g filter="url(#badgeShadow)">
    <!-- Hexagon Outer Wall -->
    <polygon points="256,20 456,135 456,377 256,492 56,377 56,135" 
             fill="url(#badgeRadialBg)" 
             stroke="url(#badgeGoldFoil)" 
             stroke-width="5" />

    <!-- Hexagon Inner Inset Bevel -->
    <polygon points="256,36 440,142 440,370 256,476 72,370 72,142" 
             fill="none" 
             stroke="url(#badgeEmeraldFoil)" 
             stroke-width="2" 
             stroke-opacity="0.5" />

    <!-- Circular Seal Guilloché Frame -->
    <circle cx="256" cy="256" r="172" fill="none" stroke="url(#badgeGoldFoil)" stroke-width="2" stroke-dasharray="4 3" opacity="0.6" />
    <circle cx="256" cy="256" r="162" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

    <!-- Central Logo Mark Scaled & Centered -->
    <g transform="translate(142, 136) scale(0.45)">
      <!-- LEFT WING OF "V" -->
      <path d="M 124 142 C 142 142, 168 156, 178 174 L 242 334 C 248 348, 246 362, 236 370 C 226 378, 212 376, 204 362 L 106 172 C 98 156, 108 142, 124 142 Z" 
            fill="url(#badgeEmeraldFoil)" />
      <path d="M 128 152 L 216 348" stroke="rgba(255, 255, 255, 0.6)" stroke-width="4" stroke-linecap="round" />

      <!-- RIGHT WING OF "V" (Q1, Median, Q3) -->
      <rect x="264" y="278" width="34" height="96" rx="10" fill="#14B8A6" />
      <rect x="316" y="214" width="34" height="160" rx="10" fill="url(#badgeEmeraldFoil)" />
      <rect x="368" y="146" width="34" height="228" rx="10" fill="url(#badgeEmeraldFoil)" />

      <!-- The Arm's Length Arc -->
      <path d="M 100 286 C 170 366, 260 380, 360 280 C 400 240, 428 175, 436 128" 
            fill="none" stroke="url(#badgeGoldFoil)" stroke-width="7" stroke-linecap="round" />

      <!-- Nodes -->
      <circle cx="152" cy="336" r="8" fill="#F59E0B" stroke="#FFFFFF" stroke-width="3" />
      <circle cx="333" cy="298" r="10" fill="#10B981" stroke="#FFFFFF" stroke-width="3" />
      <circle cx="436" cy="128" r="7" fill="#FDE68A" stroke="#F59E0B" stroke-width="2.5" />

      <!-- Apex Star -->
      <g transform="translate(436, 128)">
        <path d="M 0 -24 L 6 -6 L 24 0 L 6 6 L 0 24 L -6 6 L -24 0 L -6 -6 Z" fill="url(#badgeGoldFoil)" />
      </g>
    </g>

    <!-- Top Ribbon / Heading Banner -->
    <g transform="translate(256, 78)">
      <text font-family="'Inter', sans-serif" font-size="12" font-weight="800" letter-spacing="3px" fill="#FCD34D" text-anchor="middle">
        VIETSTOCK • TP BENCHMARKING
      </text>
    </g>

    <!-- Lower Compliance Pill -->
    <g transform="translate(256, 420)">
      <rect x="-105" y="-15" width="210" height="30" rx="15" fill="rgba(15, 23, 42, 0.9)" stroke="url(#badgeGoldFoil)" stroke-width="1.2" />
      <text x="0" y="4.5" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.8px" fill="#6EE7B7" text-anchor="middle">
        NGHỊ ĐỊNH 132/2020/NĐ-CP
      </text>
    </g>

    <!-- Lower Secondary Verification Ribbon -->
    <g transform="translate(256, 448)">
      <text font-family="'Inter', sans-serif" font-size="9" font-weight="600" letter-spacing="1.5px" fill="#94A3B8" text-anchor="middle">
        ARM'S LENGTH RANGE • AUDIT READY
      </text>
    </g>
  </g>
</svg>
