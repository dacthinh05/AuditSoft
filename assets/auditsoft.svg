<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Squircle Canvas -->
    <linearGradient id="asBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131F" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>

    <!-- Subtle Ambient Top-Left & Bottom-Right Highlights -->
    <radialGradient id="asGlowTop" cx="15%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="asGlowBot" cx="85%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <!-- Left Pillar: So Cai (General Ledger Financial Stream) -->
    <linearGradient id="ledgerBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Right Pillar: So NKC (Journal Audit Stream) -->
    <linearGradient id="ledgerGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B3F05D" />
      <stop offset="45%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Central Reconcile Core (B360 Precision Diamond) -->
    <linearGradient id="coreDiamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>
  </defs>

  <!-- 1. Squircle Container -->
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#asBg)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#asGlowTop)" />
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#asGlowBot)" />

  <!-- 2. Dual-Ledger Monogram 'A' -->
  <!-- Left Pillar -->
  <path d="M 128 44 
           L 152 94 
           L 100 210 
           L 54 210 
           C 46 210 42 202 46 194 
           L 118 48 
           C 120 45 124 44 128 44 Z" 
        fill="url(#ledgerBlue)" />

  <!-- Right Pillar -->
  <path d="M 128 44 
           C 132 44 136 45 138 48 
           L 210 194 
           C 214 202 210 210 202 210 
           L 156 210 
           L 104 94 
           L 128 44 Z" 
        fill="url(#ledgerGreen)" />

  <!-- B360 Reconcile Core (Central Diamond) -->
  <polygon points="128,104 150,140 128,176 106,140" 
           fill="url(#coreDiamond)" 
           stroke="#090D17" 
           stroke-width="4.5" 
           stroke-linejoin="round" />

  <!-- Precision Center Lock -->
  <circle cx="128" cy="140" r="4" fill="#047857" />
</svg>
